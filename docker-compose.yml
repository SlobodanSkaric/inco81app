services:
  db:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
       MYSQL_USER: schara81
       MYSQL_PASSWORD: schara81
       MYSQL_ROOT_PASSWORD: schara81
       MYSQL_DATABASE: inco81app
    ports: 
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: redis_inco81app
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    #restart: always

  app:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: schara81
      DATABASE_PASSWORD: schara81
      DATABASE_NAME: inco81app
      DATABASE_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis

volumes:
  db_data:
  redis_data: